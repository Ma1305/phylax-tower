# Local run of the three Phylax Tower services. Database: MongoDB Atlas only (MONGODB_URI in ../.env).
#   sudo docker compose -f deploy/docker-compose.yml up --build
name: holdshort

services:
  tower:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: holdshort-tower:local
    env_file: ../.env
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  viz-api:
    build:
      context: ..
      dockerfile: deploy/viz-api.Dockerfile
    image: holdshort-viz-api:local
    env_file: ../.env
    environment:
      PORT: "8100"
    ports:
      - "8100:8100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8100/viz/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  viz-web:
    build:
      context: ..
      dockerfile: deploy/viz-web.Dockerfile
      args:
        # The browser calls these directly, so they are host URLs, not service names.
        VITE_VIZ_API: ${VITE_VIZ_API:-http://localhost:8100}
        VITE_TOWER_API: ${VITE_TOWER_API:-http://localhost:8000}
    image: holdshort-viz-web:local
    environment:
      PORT: "8080"
    ports:
      - "5180:8080"
    depends_on:
      - viz-api
      - tower
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
