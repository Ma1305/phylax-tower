# Smoke-run override: a throwaway database and free host ports (never 8000 / 8100 / 5180).
#   uv run python scripts/setup_atlas.py --db holdshort_v2_t41_docker
#   sudo SMOKE_DB=holdshort_v2_t41_docker docker compose -f deploy/docker-compose.yml \
#        -f deploy/docker-compose.smoke.yml up --build -d
# Host networking: the containers listen straight on $PORT, which also proves $PORT is honoured,
# and they reach Atlas even where the docker bridge has no outbound access.
name: holdshort-smoke

services:
  tower:
    network_mode: host
    ports: !reset []
    environment:
      PORT: "18041"
      MONGODB_DB: ${SMOKE_DB:-holdshort_v2_t41_docker}
      VOICE_ENABLED: "false"
      CORS_ORIGINS: http://localhost:18241
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18041/health || exit 1"]
    restart: "no"

  viz-api:
    network_mode: host
    ports: !reset []
    environment:
      PORT: "18141"
      MONGODB_DB: ${SMOKE_DB:-holdshort_v2_t41_docker}
      CORS_ORIGINS: http://localhost:18241
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18141/viz/health || exit 1"]
    restart: "no"

  viz-web:
    build:
      args:
        VITE_VIZ_API: http://localhost:18141
        VITE_TOWER_API: http://localhost:18041
    image: holdshort-viz-web:smoke
    network_mode: host
    ports: !reset []
    environment:
      PORT: "18241"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18241/ >/dev/null || exit 1"]
    restart: "no"
