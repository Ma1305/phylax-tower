[project]
name = "hold-short"
version = "0.0.0"
description = "Phylax Tower - auditable tower-radio agents on MongoDB Atlas"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.10",
    "python-dotenv>=1.0",
    "anthropic>=0.70",
    "requests>=2.32",
    "pydantic>=2",
    "fastapi>=0.163.0",
    "uvicorn[standard]>=0.54.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-mongodb>=0.5.1",
    "python-multipart>=0.0.33",
    "shapely>=2.2.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.10",
    "websockets>=17.4",
    "pytest-timeout>=2.4.0",
    "langchain-google-genai>=4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["holdshort"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# the text-to-speech helper keeps its long ffmpeg/description lines
"scripts/audio/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"
