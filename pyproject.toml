[project]
name = "hold-short"
version = "0.0.0"
description = "Hold Short - auditable tower-radio agents on MongoDB Atlas"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.10",
    "python-dotenv>=1.0",
    "anthropic>=0.70",
    "requests>=2.32",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["holdshort"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# section-6 verify scripts predate the lint config; only real errors (F) are checked there
"scripts/verify/*.py" = ["E", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"
